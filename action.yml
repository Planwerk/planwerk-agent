name: 'Planwerk Agent'
description: 'AI-powered code review for GitHub Pull Requests using Claude'
author: 'planwerk'
branding:
  icon: 'check-square'
  color: 'purple'

inputs:
  pr-ref:
    description: 'PR reference: URL, owner/repo#number, or PR number for the current repo. Defaults to the PR that triggered the workflow.'
    required: false
    default: ${{ github.event.pull_request.number }}
  patterns:
    description: 'Comma-separated additional pattern directories to load alongside the built-in patterns.'
    required: false
    default: ''
  min-severity:
    description: 'Minimum severity to report (info, warning, critical, blocking). Empty keeps the repository''s .planwerk/config.yaml review.min-severity, or the compiled-in default (info).'
    required: false
    default: ''
  format:
    description: 'Output format (markdown, json, sarif). markdown and json are written to the action log; sarif is written to a file named by the sarif-file output, for github/codeql-action/upload-sarif. Posting to the PR always uses markdown, so post-inline is ignored for json and sarif. The action decides by this input, so set sarif here rather than in .planwerk/config.yaml. Empty keeps the repository''s .planwerk/config.yaml review.format, or the compiled-in default (markdown).'
    required: false
    default: ''
  max-findings:
    description: 'Cap on findings returned. 0 disables the cap.'
    required: false
    default: '0'
  post-inline:
    description: 'Post findings as inline review comments via the GitHub Review API and keep one summary comment up to date. Ignored when format is json or sarif.'
    required: false
    default: 'true'
  resolve-outdated:
    description: 'Resolve the inline review threads earlier runs opened once GitHub marks them outdated, unless someone replied or a current finding still covers their lines (passes --resolve-outdated). Needs post-inline and a token with `contents: write`; without it the run logs a warning and the review still succeeds.'
    required: false
    default: 'false'
  thorough:
    description: 'Run the additional adversarial review pass.'
    required: false
    default: 'false'
  structure-model:
    description: 'Model for the mechanical JSON-structuring passes, independent of the main review model (env: PLANWERK_STRUCTURE_MODEL). Empty keeps the compiled-in default (sonnet).'
    required: false
    default: ''
  structure-effort:
    description: 'Reasoning effort for the JSON-structuring passes: low, medium, high, xhigh, max (env: PLANWERK_STRUCTURE_EFFORT). Empty keeps the compiled-in default (xhigh).'
    required: false
    default: ''
  local:
    description: 'Operate on the repository already checked out by actions/checkout (passes --local) instead of cloning it a second time into a temp dir. Skips the redundant clone — the runner workspace already holds the repo. Requires an authenticated gh and a clean working tree.'
    required: false
    default: 'false'
  version:
    description: 'planwerk-agent release tag to install (e.g. v0.3.0). Use "latest" to resolve to the most recent release. Ignored when binary-path is set.'
    required: false
    default: 'latest'
  binary-path:
    description: 'Path to a pre-built planwerk-agent binary. When set, the download step is skipped — useful for testing the action against a development build of the binary.'
    required: false
    default: ''
  github-token:
    description: 'Token used to fetch PR data and post review comments. Needs `pull-requests: write` and `contents: read` (`contents: write` with resolve-outdated).'
    required: false
    default: ${{ github.token }}
  anthropic-api-key:
    description: 'Anthropic API key consumed by Claude Code in non-interactive mode. Required.'
    required: true

outputs:
  findings-count:
    description: 'Total number of findings reported (0 when no review comment was found).'
    value: ${{ steps.parse.outputs.findings-count }}
  blocking-count:
    description: 'Number of BLOCKING findings.'
    value: ${{ steps.parse.outputs.blocking-count }}
  critical-count:
    description: 'Number of CRITICAL findings.'
    value: ${{ steps.parse.outputs.critical-count }}
  warning-count:
    description: 'Number of WARNING findings.'
    value: ${{ steps.parse.outputs.warning-count }}
  info-count:
    description: 'Number of INFO findings.'
    value: ${{ steps.parse.outputs.info-count }}
  sarif-file:
    description: 'Path of the SARIF 2.1.0 report when format=sarif, empty otherwise; pass it to github/codeql-action/upload-sarif.'
    value: ${{ steps.review.outputs.sarif-file }}

runs:
  using: 'composite'
  steps:
    - name: Install Claude Code
      shell: bash
      run: |
        set -euo pipefail
        npm install -g @anthropic-ai/claude-code
        claude --version

    - name: Install planwerk-agent
      id: install
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        BINARY_PATH: ${{ inputs.binary-path }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ -n "$BINARY_PATH" ]; then
          if [ ! -x "$BINARY_PATH" ]; then
            echo "binary-path '$BINARY_PATH' is not executable" >&2
            exit 1
          fi
          dir=$(cd "$(dirname "$BINARY_PATH")" && pwd)
          echo "$dir" >> "$GITHUB_PATH"
          "$BINARY_PATH" --version
          exit 0
        fi

        case "${RUNNER_OS:-}" in
          Linux) os=linux ;;
          macOS) os=darwin ;;
          *) echo "unsupported runner OS: ${RUNNER_OS:-}" >&2; exit 1 ;;
        esac
        case "${RUNNER_ARCH:-}" in
          X64)   arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "unsupported runner arch: ${RUNNER_ARCH:-}" >&2; exit 1 ;;
        esac

        if [ "$VERSION" = "latest" ]; then
          tag=$(gh release view --repo planwerk/planwerk-agent --json tagName -q .tagName)
        else
          tag="$VERSION"
        fi
        ver="${tag#v}"
        asset="planwerk-agent_${ver}_${os}_${arch}.tar.gz"

        workdir="$RUNNER_TEMP/planwerk-agent"
        mkdir -p "$workdir"
        echo "Downloading $asset from release $tag"
        gh release download "$tag" \
          --repo planwerk/planwerk-agent \
          --pattern "$asset" \
          --dir "$workdir"
        tar -xzf "$workdir/$asset" -C "$workdir"
        echo "$workdir" >> "$GITHUB_PATH"
        "$workdir/planwerk-agent" --version

    - name: Run review
      id: review
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        PR_REF: ${{ inputs.pr-ref }}
        FORMAT: ${{ inputs.format }}
        MIN_SEVERITY: ${{ inputs.min-severity }}
        MAX_FINDINGS: ${{ inputs.max-findings }}
        POST_INLINE: ${{ inputs.post-inline }}
        RESOLVE_OUTDATED: ${{ inputs.resolve-outdated }}
        THOROUGH: ${{ inputs.thorough }}
        STRUCTURE_MODEL: ${{ inputs.structure-model }}
        STRUCTURE_EFFORT: ${{ inputs.structure-effort }}
        PATTERNS: ${{ inputs.patterns }}
        LOCAL: ${{ inputs.local }}
      run: |
        set -euo pipefail
        if [ -z "${PR_REF:-}" ]; then
          echo "pr-ref is empty: pass it explicitly when not running on a pull_request event" >&2
          exit 1
        fi

        # Pass each flag only when the caller set it. planwerk-agent resolves
        # an unset flag from .planwerk/config.yaml, and it decides "unset" by
        # asking cobra whether the flag CHANGED — so passing the action's own
        # default was indistinguishable from the caller typing it, and the
        # repository's review.format / review.min-severity could never win.
        # max-findings and patterns were already conditional for this reason.
        args=()
        if [ -n "$FORMAT" ]; then
          args+=(--format "$FORMAT")
        fi
        if [ -n "$MIN_SEVERITY" ]; then
          args+=(--min-severity "$MIN_SEVERITY")
        fi

        # With local=true, operate on the repo actions/checkout already placed
        # in the runner workspace instead of cloning it a second time. The PR
        # reference is still passed explicitly so origin is validated and the
        # working tree is switched to the PR head.
        if [ "$LOCAL" = "true" ]; then
          args+=(--local)
        fi

        if [ "$POST_INLINE" = "true" ]; then
          case "$FORMAT" in
            json|sarif)
              echo "post-inline=true is incompatible with format=$FORMAT — skipping inline posting" >&2
              ;;
            *)
              args+=(--inline)
              if [ "$RESOLVE_OUTDATED" = "true" ]; then
                args+=(--resolve-outdated)
              fi
              ;;
          esac
        elif [ "$RESOLVE_OUTDATED" = "true" ]; then
          echo "resolve-outdated=true needs post-inline=true; skipping it" >&2
        fi
        if [ "$THOROUGH" = "true" ]; then
          args+=(--thorough)
        fi
        # Empty inputs keep the compiled-in structure-tier defaults, so the
        # behavior is identical to today unless a caller sets them.
        if [ -n "$STRUCTURE_MODEL" ]; then
          args+=(--structure-model "$STRUCTURE_MODEL")
        fi
        if [ -n "$STRUCTURE_EFFORT" ]; then
          args+=(--structure-effort "$STRUCTURE_EFFORT")
        fi
        if [ "$MAX_FINDINGS" != "0" ] && [ -n "$MAX_FINDINGS" ]; then
          args+=(--max-findings "$MAX_FINDINGS")
        fi
        if [ -n "$PATTERNS" ]; then
          IFS=',' read -ra dirs <<< "$PATTERNS"
          for d in "${dirs[@]}"; do
            d=$(printf '%s' "$d" | awk '{$1=$1};1')
            [ -n "$d" ] && args+=(--patterns "$d")
          done
        fi

        # The SARIF document is the whole of stdout, so it goes to a file
        # instead of the log; progress stays on stderr. RUNNER_TEMP keeps the
        # --local working tree clean.
        if [ "$FORMAT" = "sarif" ]; then
          sarif_file="$RUNNER_TEMP/planwerk-agent.sarif"
          planwerk-agent "${args[@]}" "$PR_REF" > "$sarif_file"
          echo "sarif-file=$sarif_file" >> "$GITHUB_OUTPUT"
        else
          planwerk-agent "${args[@]}" "$PR_REF"
        fi

    - name: Parse findings counts
      id: parse
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        DEFAULT_TOKEN: ${{ inputs.github-token == github.token }}
        PR_REF: ${{ inputs.pr-ref }}
        FORMAT: ${{ inputs.format }}
        SARIF_FILE: ${{ steps.review.outputs.sarif-file }}
      run: |
        set -euo pipefail

        # In SARIF mode nothing is posted, so a data block on the PR would be
        # an earlier run's: count the results of the report this run wrote,
        # by each result's severity property.
        if [ "$FORMAT" = "sarif" ]; then
          if [ -z "$SARIF_FILE" ] || [ ! -s "$SARIF_FILE" ]; then
            echo "No SARIF report was written; emitting empty counts." >&2
            {
              echo "findings-count="
              echo "blocking-count="
              echo "critical-count="
              echo "warning-count="
              echo "info-count="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count() {
            jq --arg sev "$1" '[.runs[].results[] | select($sev == "" or .properties.severity == $sev)] | length' "$SARIF_FILE"
          }
          {
            echo "findings-count=$(count "")"
            echo "blocking-count=$(count BLOCKING)"
            echo "critical-count=$(count CRITICAL)"
            echo "warning-count=$(count WARNING)"
            echo "info-count=$(count INFO)"
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [[ "$PR_REF" =~ ^https?://github.com/([^/]+)/([^/]+)/pull/([0-9]+) ]]; then
          owner="${BASH_REMATCH[1]}"
          repo="${BASH_REMATCH[2]}"
          number="${BASH_REMATCH[3]}"
        elif [[ "$PR_REF" =~ ^([^/]+)/([^#]+)#([0-9]+)$ ]]; then
          owner="${BASH_REMATCH[1]}"
          repo="${BASH_REMATCH[2]}"
          number="${BASH_REMATCH[3]}"
        elif [[ "$PR_REF" =~ ^[0-9]+$ ]]; then
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"
          number="$PR_REF"
        else
          echo "Could not parse pr-ref '$PR_REF' for output extraction; skipping." >&2
          {
            echo "findings-count="
            echo "blocking-count="
            echo "critical-count="
            echo "warning-count="
            echo "info-count="
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # The summary comment is edited on every run, so its updated_at is
        # the last run's time. A review carries a data block only from before
        # the summary moved into that comment, or when the comment could not
        # be posted. Read both, every page, and take the newest. Only a post
        # that opens with the report's heading, by the token's own account,
        # a maintainer or, under the job's own token, the Actions bot counts,
        # so a block another account pasted into a comment cannot set the
        # counts. Every workflow posts as the Actions bot under the job's own
        # token, so under any other token the tool's posts are never the
        # bot's. GraphQL may name an app's account with or without the [bot]
        # suffix REST gives it, so both forms match. When the login cannot be
        # read, as GitHub may refuse it to an app's token, the other rules
        # still apply.
        bot=""
        if [ "$DEFAULT_TOKEN" = "true" ]; then
          bot="github-actions[bot]"
        fi
        me=$(gh api graphql -f query='query { viewer { login } }' --jq .data.viewer.login 2>/dev/null || true)
        if [ -z "$me" ]; then
          echo "Could not read the token's login; counting only posts by ${bot:+$bot and }maintainers." >&2
        fi
        with_block='.[] | select(.body and (.body | startswith("# Review: ")) and (.body | contains("planwerk-agent-data")) and (($me != "" and (.user.login == $me or .user.login == ($me + "[bot]"))) or ($bot != "" and .user.login == $bot) or .author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR"))'
        body=$( {
          gh api --paginate "repos/$owner/$repo/pulls/$number/reviews" \
            | jq --arg me "$me" --arg bot "$bot" "$with_block | {t: .submitted_at, body}"
          gh api --paginate "repos/$owner/$repo/issues/$number/comments" \
            | jq --arg me "$me" --arg bot "$bot" "$with_block | {t: .updated_at, body}"
        } | jq -rs 'sort_by(.t) | last | (.body // "")' )

        json=$(printf '%s' "$body" | awk '/planwerk-agent-data/{flag=1; next} /-->/{flag=0} flag')

        if [ -z "$json" ]; then
          echo "No planwerk-agent data block found on PR $number; emitting zero counts." >&2
          {
            echo "findings-count=0"
            echo "blocking-count=0"
            echo "critical-count=0"
            echo "warning-count=0"
            echo "info-count=0"
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi

        total=$(printf '%s' "$json" | jq '.findings | length')
        blocking=$(printf '%s' "$json" | jq '[.findings[] | select(.severity=="BLOCKING")] | length')
        critical=$(printf '%s' "$json" | jq '[.findings[] | select(.severity=="CRITICAL")] | length')
        warning=$(printf '%s' "$json" | jq '[.findings[] | select(.severity=="WARNING")]  | length')
        info=$(printf '%s' "$json" | jq '[.findings[] | select(.severity=="INFO")]     | length')

        {
          echo "findings-count=$total"
          echo "blocking-count=$blocking"
          echo "critical-count=$critical"
          echo "warning-count=$warning"
          echo "info-count=$info"
        } >> "$GITHUB_OUTPUT"
