name: Action smoke test

# Verifies the composite action defined in action.yml end-to-end against the PR
# that triggered the workflow. Skipped for forked PRs (they cannot access the
# ANTHROPIC_API_KEY secret) and skipped automatically when the secret is unset.
on:
  pull_request:
    paths:
      - 'action.yml'
      - '.github/workflows/action-smoke.yml'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read
  pull-requests: write

jobs:
  preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      has-key: ${{ steps.check.outputs.has-key }}
    steps:
      - id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "has-key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-key=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY secret is not set; skipping smoke test." >&2
          fi

  smoke:
    needs: preflight
    if: needs.preflight.outputs.has-key == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build planwerk-agent from source
        run: go build -o ./planwerk-agent ./cmd/planwerk-agent

      - name: Run Planwerk Agent action
        id: review
        uses: ./
        with:
          binary-path: ${{ github.workspace }}/planwerk-agent
          min-severity: warning
          post-inline: 'true'
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Show outputs
        run: |
          echo "findings-count=${{ steps.review.outputs.findings-count }}"
          echo "blocking-count=${{ steps.review.outputs.blocking-count }}"
          echo "critical-count=${{ steps.review.outputs.critical-count }}"
          echo "warning-count=${{ steps.review.outputs.warning-count }}"
          echo "info-count=${{ steps.review.outputs.info-count }}"

      # The format is not part of the review's cache key, so this run is
      # served from the cache the run above wrote and costs no second review.
      - name: Run Planwerk Agent action in SARIF mode
        id: sarif
        uses: ./
        with:
          binary-path: ${{ github.workspace }}/planwerk-agent
          min-severity: warning
          format: sarif
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

      # Only the shape is checked: uploading needs security-events: write,
      # which this job does not hold.
      - name: Check the SARIF report
        env:
          SARIF_FILE: ${{ steps.sarif.outputs.sarif-file }}
          FINDINGS_COUNT: ${{ steps.sarif.outputs.findings-count }}
        run: |
          test -s "$SARIF_FILE"
          jq -e '.version == "2.1.0" and (.runs | length == 1) and (.runs[0].results | type == "array")' "$SARIF_FILE"
          echo "findings-count=$FINDINGS_COUNT"
