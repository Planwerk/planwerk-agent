name: CI

# On main (post-merge) only the coverage baseline is rebuilt; everything else
# already ran on the PR against identical code, so it is not run again. The test
# job is therefore the only job that triggers on push to main, and only its
# ubuntu leg (the one that uploads coverage to Codecov / the README badge).
on:
  push:
    branches: [main]
  pull_request:

# Every job only reads the checkout and none pushes, so no checkout keeps its
# token (persist-credentials: false). Codecov authenticates with its own token.
permissions:
  contents: read

jobs:
  test:
    # PRs run the full matrix; main runs ubuntu only, since that is the single
    # leg that uploads coverage to Codecov.
    strategy:
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race -coverprofile=cover.out ./...
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./cover.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./cmd/planwerk-agent/

  # Proves the contributor default end to end: a runner that installs no Go
  # builds the toolbox image and compiles the binary inside it. CI=true
  # resolves TOOLBOX to 0 for every other use of make, so this job opts back
  # in on the command line.
  toolbox-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make build TOOLBOX=1
      - name: Assert the binary landed in the checkout, owned by the runner user
        run: |
          test -x planwerk-agent
          test "$(stat -c '%u' planwerk-agent)" = "$(id -u)"
          ./planwerk-agent --version

  fuzz:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -run=^$ -fuzz=FuzzParseDiff -fuzztime=30s ./internal/github/
      - run: go test -run=^$ -fuzz=FuzzParse -fuzztime=30s ./internal/patterns/
      - run: go test -run=^$ -fuzz=FuzzStripMarkdownFences -fuzztime=30s ./internal/claude/
      - run: go test -run=^$ -fuzz=FuzzMatchExpr -fuzztime=30s ./internal/search/

  vet:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...

  # Validates the Claude Code plugin marketplace this repo ships (the draft /
  # elaborate / meta skills). `go test ./internal/skills` already checks that the
  # skills parse and their shared references resolve; this is the manifest schema
  # check only the claude CLI can do. It reads local files and needs no
  # credentials.
  plugin:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Claude Code
        env:
          # renovate: datasource=npm depName=@anthropic-ai/claude-code
          CLAUDE_CODE_VERSION: '2.1.306'
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict plugins/planwerk

  govulncheck:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The action's own checkout would keep the token for the govulncheck it
      # installs at run time; the checkout above has placed the tree already.
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          repo-checkout: false

  gosec:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # G204/G304/G122 are inherent to this tool: it orchestrates git/gh/claude
      # subprocesses and reads files from user-specified repositories.
      - uses: securego/gosec@5eb1d104ef85ff2c905c877eb600e8c1dee33a22 # v2.30.0
        # The gosec image pins GOTOOLCHAIN=local with a Go that can lag behind
        # our go.mod toolchain; allow it to fetch the version go.mod requires.
        env:
          GOTOOLCHAIN: auto
        with:
          args: -exclude=G204,G304,G122 ./...
