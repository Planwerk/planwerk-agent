name: Lint

# Lint is deterministic over identical code, so it runs on PRs only — the
# post-merge result on main would just repeat the PR run.
on:
  pull_request:

# Both jobs only read the checkout, so neither checkout keeps its token
# (persist-credentials: false).
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  # Every external action is pinned to a commit with a `# vX.Y.Z` comment,
  # and Renovate keeps the pins current.
  action-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash tools/verify-action-pins.sh
