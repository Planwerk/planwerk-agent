name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The SLSA generator signs a base64-encoded sha256sum-style list. It is
      # exactly what goreleaser already wrote (and cosign already signed), so
      # the provenance covers every published artifact rather than a second,
      # separately built subset.
      - name: Export the release checksums as SLSA subjects
        id: hashes
        run: |
          set -euo pipefail
          checksums=$(find dist -maxdepth 1 -name '*checksums.txt' -print -quit)
          if [ -z "$checksums" ]; then
            echo "no checksum file in dist/; goreleaser did not produce one" >&2
            exit 1
          fi
          echo "hashes=$(base64 -w0 < "$checksums")" >> "$GITHUB_OUTPUT"

  provenance:
    needs: [release]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      upload-assets: true
