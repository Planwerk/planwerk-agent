name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      # GoReleaser publishes through the API with GITHUB_TOKEN and never
      # pushes, so the checkout keeps no token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The release builds without the Go cache, so no entry an earlier run
      # wrote reaches the published binaries.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The SLSA generator signs a base64-encoded sha256sum-style list. It is
      # exactly what goreleaser already wrote (and cosign already signed), so
      # the provenance covers every published artifact rather than a second,
      # separately built subset.
      - name: Export the release checksums as SLSA subjects
        id: hashes
        run: |
          set -euo pipefail
          checksums=$(find dist -maxdepth 1 -name '*checksums.txt' -print -quit)
          if [ -z "$checksums" ]; then
            echo "no checksum file in dist/; goreleaser did not produce one" >&2
            exit 1
          fi
          echo "hashes=$(base64 -w0 < "$checksums")" >> "$GITHUB_OUTPUT"

  provenance:
    needs: [release]
    permissions:
      actions: read
      id-token: write
      contents: write
    # slsa-verifier verifies the generator's ref, which works only for a
    # vX.Y.Z tag, so this reference stays a tag and is never a SHA.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      upload-assets: true
